backend:
  name: git-gateway
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "menu"
  - label: "المنيو والأسعار"
    folder: "content/menu"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "اسم الوجبة", name: "title", widget: "string"}
      - {label: "السعر", name: "price", widget: "string"}
      - {label: "الوصف", name: "description", widget: "text"}
      - {label: "صورة الوجبة", name: "image", widget: "image"}
