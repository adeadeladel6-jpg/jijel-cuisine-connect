backend:
  name: git-gateway
  branch: main
publish_mode: editorial_workflow
media_folder: "public/images"
public_folder: "/images"
collections:
  - name: "menu"
    label: "المنيو والأسعار"
    folder: "src/content/menu"
    create: true
    fields:
      - {name: "title", label: "اسم الوجبة", widget: "string"}
      - {name: "price", label: "السعر", widget: "string"}

